{% extends "base.html" %}
{% block content %}

<section class="auth-section">
  <div class="auth-box">
    <div class="auth-icon">🔑</div>
    <h2>パスワード変更</h2>
    <p class="auth-desc">ログイン中：<strong>{{ user_name }}</strong> さん</p>

    {% if msg %}
      <div class="alert alert-{{ msg[0] }}">{{ msg[1] }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>現在のパスワード</label>
        <input type="password" name="current_password" placeholder="現在のパスワード" required>
      </div>
      <div class="form-group">
        <label>新しいパスワード</label>
        <input type="password" name="new_password" placeholder="新しいパスワード（4文字以上）" required>
      </div>
      <div class="form-group">
        <label>確認用パスワード</label>
        <input type="password" name="confirm_password" placeholder="もう一度入力" required>
      </div>
      <button type="submit" class="btn btn-full">変更する</button>
    </form>
    <a href="{{ url_for('page_admin_dashboard') }}" class="btn btn-outline" style="display:block; text-align:center; margin-top:16px;">← ページ管理に戻る</a>
  </div>
</section>

{% endblock %}
